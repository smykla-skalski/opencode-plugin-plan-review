name: Bug
description: The panel, the review loop or execution did something wrong
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Lines from opencode's log that mention smykla.plan-review. Remove anything private.
      render: text
  - type: input
    id: versions
    attributes:
      label: Plugin and opencode versions
      placeholder: 0.1.0 / 2.0.19
    validations:
      required: true
