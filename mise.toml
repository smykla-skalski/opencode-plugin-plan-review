[tools]
node = "24.21.0"
oxlint = "1.84.0"
markdownlint-cli2 = "0.23.3"
actionlint = "1.7.12"
zizmor = "1.30.1"

[tasks.install]
description = "Install npm dependencies from the lockfile"
run = "npm ci --ignore-scripts --no-audit --no-fund"

[tasks.typecheck]
description = "Typecheck the server and TUI entries against opencode v2's plugin types"
run = "npx tsc -p ."

[tasks."lint:js"]
description = "Lint with oxlint, warnings denied"
run = "oxlint --deny-warnings --report-unused-disable-directives"

[tasks."lint:md"]
description = "Lint markdown for fences that never close"
run = "markdownlint-cli2"

[tasks."lint:actions"]
description = "Lint the workflows and audit them for supply-chain issues"
run = ["actionlint", "zizmor --offline --min-severity medium .github/workflows"]

[tasks.test]
description = "Run the unit tests for the plan logic"
run = "node --experimental-strip-types --test --test-force-exit test/*.test.ts"

[tasks.pack]
description = "Check what npm would publish"
run = "npm pack --dry-run"

[tasks.check]
description = "Run every gate CI runs"
depends = ["typecheck", "lint:js", "lint:md", "lint:actions", "test", "pack"]
